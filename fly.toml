# !! App DESTROYED 2026-10-25 (with its volume). Do not deploy unless Kamil asks; relaunch
# !! steps and the backup location are in CLAUDE.md -> Environments and deployment.
#
# Fly.io — PRODUCTION. Staging lives in fly.staging.toml; the two differ only in app name,
# volume name, and RC_ENV.
#
# Deploy:  flyctl deploy -c fly.toml
# Secrets: flyctl secrets set -a research-companion KEY=value   (never put secrets in this file)

app = "research-companion"
# Kamil is in CALIFORNIA. `sjc` (San Jose) is the nearest region and was chosen deliberately on
# 2026-07-29. Do not "align" this with staging's `dfw`: that value was picked when the plan wrongly
# assumed Colorado, and staging keeps it only because it already has a volume there.
#
# The region is fixed at VOLUME-CREATION time, not at deploy time. A volume lives in one region and
# cannot be moved, so changing this line after the volume exists silently does nothing — the machine
# follows its volume. If this ever needs to change, the volume has to be recreated and the data
# migrated. Verify with `flyctl volumes list -a research-companion` before deploying.
primary_region = "sjc"

# TOP-LEVEL, not inside [[vm]]. `flyctl config validate` accepts swap_size_mb nested under [[vm]]
# and then silently ignores it — the first version of this file made that mistake and the deployed
# machine had an empty /proc/swaps. With one worker, an OOM is a full outage that also destroys
# every in-flight job, so verify with `fly ssh console -C "cat /proc/swaps"` after changing it.
swap_size_mb = 512

# Fly's default is 5 seconds between SIGTERM and SIGKILL — far too short to drain anything. This
# raises it to the 300s maximum so a graceful-shutdown hook has room to exist. NOTE: the hook does
# not exist yet (see the deploy hazard below), so today this only buys uvicorn time to finish
# in-flight HTTP requests, not background jobs.
kill_timeout = 300

[build]

[env]
  RC_ENV = "prod"
  RC_HOST = "0.0.0.0"
  RC_PORT = "8080"
  # State lives on the mounted volume, NOT in the image (see Dockerfile / .dockerignore).
  RC_PROJECTS_ROOT = "/data/projects"
  RC_APP_STATE_DIR = "/data/.app-state"
  RC_APP_TITLE = "Scholiast"
  # Namespaces the Postgres process guard from staging if both use one Supabase cluster.
  RC_DEPLOY_GUARD_ID = "research-companion"
  # Must remain greater than kill_timeout. Postgres advisory locks confirm feature-aware peers
  # actually disconnected; this is the first-rollout/guard-loss safety window after exclusivity.
  RC_ACCOUNT_DELETION_OVERLAP_S = "310"

# The git-backed project stores and the app-state/audio cache. 20 GB: current real-world usage is
# ~3.2 GB, but the narration cache is unbounded until M3 adds eviction, so headroom is cheaper
# than an emergency resize.
[[mounts]]
  source = "rc_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true

  # BOTH of these are load-bearing, not tuning (CLAUDE.md invariant 1).
  #
  # Fly's default behaviour is to stop an idle machine and restart it on the next request. This
  # app runs minutes-long BACKGROUND JOBS (chat turns, audio prep, graph builds) whose results are
  # persisted only when the job finishes, and whose registries are in-memory. An autostop during
  # an idle-looking window would kill in-flight paid work exactly the way a redeploy does — the
  # failure mode the whole job+poll architecture exists to avoid. A polling client is also not
  # "traffic" in the sense Fly's scale-to-zero assumes.
  #
  # So: never stop, always keep one machine up. ONE machine, because job state and file writes are
  # in-process (invariant 6) — a second machine would serve a second, divergent copy of the store.
  auto_stop_machines = "off"
  min_machines_running = 1

  # ⚠️ DEPLOY HAZARD — autostop being off does NOT make jobs safe.
  # It only prevents Fly Proxy's *idle* shutdown. A `fly deploy` still stops and replaces the
  # machine, and a planned host migration stops it first. Jobs run in daemon threads with no
  # shutdown hook, so the process exits and takes them with it — losing paid LLM work and
  # potentially interrupting a git write.
  # Until the drain hook lands with M6 (job persistence), the operational rule is:
  #   check for active jobs before deploying, and prefer deploying when the app is idle.
  # kill_timeout above is set to the 300s maximum so the eventual hook has room to work.

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/health"        # auth-exempt in app/main.py, so this works with auth enabled
    timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
  # Memory spikes come from PyMuPDF cover rasterization and parallel graph extraction. Swap is
  # configured at the top of this file — it is NOT a [[vm]] option (see the comment there).
