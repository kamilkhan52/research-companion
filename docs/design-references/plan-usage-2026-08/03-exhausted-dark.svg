    <text x="28" y="31" fill="#F3F0E8" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" >8:08</text><text x="365" y="31" fill="#F3F0E8" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="end" >83%</text>
    <circle cx="48" cy="93" r="26" fill="#1B202B" stroke="#2A2F3A" stroke-width="1"/><path data-kind="back" data-x="36" data-y="81" data-size="24" d="M15 18l-6-6 6-6" fill="none" stroke="#F3F0E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(36 81) scale(1)"/>
    <text x="198" y="90" fill="#65D6B4" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" >DistServe: Disaggregating…</text>
    <text x="198" y="113" fill="#99A3B7" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" >2024</text><line x1="0" y1="135" x2="393" y2="135" stroke="#2A2F3A" stroke-width="1" stroke-linecap="round" />
    <text x="20" y="179" fill="#F3F0E8" font-family="Newsreader, Georgia, serif" font-size="26" font-weight="500" text-anchor="start" >Synthesis changes</text>
    <text x="20" y="215" fill="#F3F0E8" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" text-anchor="start" >Since this is the first paper we have read, the synthesis</text><text x="20" y="242" fill="#F3F0E8" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" text-anchor="start" >is being created from scratch. It establishes DistServe</text><text x="20" y="269" fill="#F3F0E8" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" text-anchor="start" >as the reference point for the disaggregation thread.</text><text x="20" y="296" fill="#F3F0E8" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" text-anchor="start" ></text><text x="20" y="323" fill="#F3F0E8" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" text-anchor="start" >The paper separates prefill from decoding and traces</text><text x="20" y="350" fill="#F3F0E8" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" text-anchor="start" >how scheduling, memory and placement shape throughput.</text>
    <rect x="14" y="770" width="365" height="58" rx="29" fill="#1B202B" stroke="#454C5B" stroke-width="1"/><text x="28" y="805" fill="#99A3B7" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" >Reply</text>
    <line x1="338" y1="808" x2="352" y2="794" stroke="#99A3B7" stroke-width="2" stroke-linecap="round" /><line x1="352" y1="794" x2="366" y2="808" stroke="#99A3B7" stroke-width="2" stroke-linecap="round" /><rect x="147" y="837" width="99" height="4" rx="2" fill="#F3F0E8" stroke="none" stroke-width="0"/><rect x="0" y="0" width="393" height="852" rx="0" fill="#0000008C" stroke="none" stroke-width="0"/><rect x="20" y="352" width="353" height="452" rx="30" fill="#1B202B" stroke="#9B8AFB" stroke-width="1.2"/><rect x="170" y="365" width="53" height="4" rx="2" fill="#454C5B" stroke="none" stroke-width="0"/><circle cx="64" cy="423" r="28" fill="#29263D" stroke="none" stroke-width="0"/><path data-kind="calendar" data-x="52" data-y="411" data-size="24" d="M7 3v3M17 3v3M4 8h16M5 5h14a1 1 0 011 1v14H4V6a1 1 0 011-1z" fill="none" stroke="#9B8AFB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(52 411) scale(1)"/><text x="40" y="478" fill="#F3F0E8" font-family="Newsreader, Georgia, serif" font-size="28" font-weight="500" text-anchor="start" >This month's allowance</text><text x="40" y="509" fill="#F3F0E8" font-family="Newsreader, Georgia, serif" font-size="28" font-weight="500" text-anchor="start" >is used</text><text x="40" y="526" fill="#99A3B7" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" >Paid work is paused until September 1.</text><text x="40" y="548" fill="#99A3B7" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" >Reading and device voice still work.</text><rect x="40" y="584" width="313" height="54" rx="16" fill="#29263D" stroke="#9B8AFB" stroke-width="0.8"/><circle cx="62" cy="611" r="5" fill="#9B8AFB" stroke="none" stroke-width="0"/><text x="78" y="616" fill="#9B8AFB" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" >Resets September 1</text><rect x="40" y="658" width="313" height="56" rx="28" fill="#65D6B4" stroke="none" stroke-width="0"/><text x="196.5" y="693" fill="#0A231B" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" >Keep reading</text><text x="196.5" y="746" fill="#65D6B4" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" >View plan &amp; usage</text>
