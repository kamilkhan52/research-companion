<svg xmlns="http://www.w3.org/2000/svg" width="393" height="852" viewBox="0 0 393 852" role="img" aria-label="too-large light">
  <title>too-large light</title>
  <rect x="0" y="0" width="393" height="852" rx="0" fill="#F3F1EA" stroke="none" stroke-width="0"/><circle cx="320" cy="210" r="154" fill="#ECE9DF" stroke="none" stroke-width="0"/>
    <text x="28" y="31" fill="#1C2129" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" >8:08</text><text x="365" y="31" fill="#1C2129" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="end" >83%</text>
    <circle cx="48" cy="93" r="26" fill="#FFFFFF" stroke="#D9D9D2" stroke-width="1"/><path data-kind="back" data-x="36" data-y="81" data-size="24" d="M15 18l-6-6 6-6" fill="none" stroke="#1C2129" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(36 81) scale(1)"/>
    <text x="198" y="90" fill="#15795F" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" >DistServe: Disaggregating…</text>
    <text x="198" y="113" fill="#5D6879" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" >2024</text><line x1="0" y1="135" x2="393" y2="135" stroke="#D9D9D2" stroke-width="1" stroke-linecap="round" />
    <text x="20" y="179" fill="#1C2129" font-family="Newsreader, Georgia, serif" font-size="26" font-weight="500" text-anchor="start" >Synthesis changes</text>
    <text x="20" y="215" fill="#1C2129" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" text-anchor="start" >Since this is the first paper we have read, the synthesis</text><text x="20" y="242" fill="#1C2129" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" text-anchor="start" >is being created from scratch. It establishes DistServe</text><text x="20" y="269" fill="#1C2129" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" text-anchor="start" >as the reference point for the disaggregation thread.</text><text x="20" y="296" fill="#1C2129" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" text-anchor="start" ></text><text x="20" y="323" fill="#1C2129" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" text-anchor="start" >The paper separates prefill from decoding and traces</text><text x="20" y="350" fill="#1C2129" font-family="Newsreader, Georgia, serif" font-size="17" font-weight="400" text-anchor="start" >how scheduling, memory and placement shape throughput.</text>
    <rect x="14" y="770" width="365" height="58" rx="29" fill="#FFFFFF" stroke="#B9BDC4" stroke-width="1"/><text x="28" y="805" fill="#5D6879" font-family="Manrope, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" >Reply</text>
    <line x1="338" y1="808" x2="352" y2="794" stroke="#5D6879" stroke-width="2" stroke-linecap="round" /><line x1="352" y1="794" x2="366" y2="808" stroke="#5D6879" stroke-width="2" stroke-linecap="round" /><rect x="147" y="837" width="99" height="4" rx="2" fill="#1C2129" stroke="none" stroke-width="0"/><rect x="0" y="0" width="393" height="852" rx="0" fill="#14182073" stroke="none" stroke-width="0"/><rect x="20" y="300" width="353" height="476" rx="30" fill="#FFFFFF" stroke="#6A55E0" stroke-width="1.2"/><rect x="170" y="313" width="53" height="4" rx="2" fill="#B9BDC4" stroke="none" stroke-width="0"/><circle cx="64" cy="371" r="28" fill="#EFECFB" stroke="none" stroke-width="0"/><path data-kind="audio" data-x="52" data-y="359" data-size="24" d="M4 14v-4a8 8 0 0116 0v4M4 14h3v6H5a1 1 0 01-1-1v-5zM20 14h-3v6h2a1 1 0 001-1v-5z" fill="none" stroke="#6A55E0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(52 359) scale(1)"/><text x="40" y="426" fill="#1C2129" font-family="Newsreader, Georgia, serif" font-size="28" font-weight="500" text-anchor="start" >This narration won't fit</text><text x="40" y="457" fill="#1C2129" font-family="Newsreader, Georgia, serif" font-size="28" font-weight="500" text-anchor="start" >your plan</text><text x="40" y="502" fill="#5D6879" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" >A studio-voice version is larger than</text><text x="40" y="524" fill="#5D6879" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" >the Free plan's whole monthly allowance.</text><text x="40" y="546" fill="#5D6879" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" >Waiting won't help.</text><rect x="40" y="582" width="313" height="54" rx="16" fill="#EFECFB" stroke="#6A55E0" stroke-width="0.8"/><circle cx="62" cy="609" r="5" fill="#6A55E0" stroke="none" stroke-width="0"/><text x="78" y="614" fill="#6A55E0" font-family="Manrope, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" >Device voice is included</text><rect x="40" y="656" width="313" height="56" rx="28" fill="#15795F" stroke="none" stroke-width="0"/><text x="196.5" y="691" fill="#F5FBF8" font-family="Manrope, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle" >Use device voice</text><text x="196.5" y="744" fill="#15795F" font-family="Manrope, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" >Not now</text>
</svg>
