<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07080e" />
  <title>Research Reading Companion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <button id="backBtn" class="icon-btn hidden" aria-label="Back">‹</button>
    <h1 id="title">Reading Companion</h1>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
  </header>

  <main id="app"><!-- views render here --></main>

  <div id="toast" class="toast hidden"></div>

  <!-- Settings drawer -->
  <div id="settings" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Settings</h2>
        <button id="closeSettings" class="icon-btn">✕</button>
      </div>

      <label class="field">
        <span>OpenRouter API key</span>
        <input id="apiKey" type="password" placeholder="sk-or-…" autocomplete="off" />
        <small id="keyHint" class="muted"></small>
      </label>

      <label class="field">
        <span>Analysis model — reads the paper, writes the scholarly record</span>
        <input id="modelSearch" type="text" placeholder="filter models… (e.g. claude opus)" />
        <select id="modelSelect" size="5"></select>
      </label>

      <label class="field">
        <span>Narration model — adapts the analysis text for listening (lighter is fine)</span>
        <input id="narrSearch" type="text" placeholder="filter models… (e.g. haiku)" />
        <select id="narrSelect" size="5"></select>
      </label>

      <hr style="border:none;border-top:1px solid var(--line);margin:6px 0 14px" />

      <label class="field">
        <span>Speech (audio) provider</span>
        <select id="speechProvider">
          <option value="openai">OpenAI — premium (needs OpenAI key)</option>
          <option value="browser">Browser built-in — free</option>
        </select>
      </label>

      <div id="openaiFields">
        <label class="field">
          <span>OpenAI API key (speech only)</span>
          <input id="openaiKey" type="password" placeholder="sk-…" autocomplete="off" />
          <small id="openaiHint" class="muted"></small>
        </label>
        <div class="row">
          <label class="field grow"><span>Voice</span><select id="ttsVoice"></select></label>
          <label class="field"><span>TTS model</span>
            <select id="ttsModel">
              <option value="gpt-4o-mini-tts">gpt-4o-mini-tts</option>
              <option value="tts-1-hd">tts-1-hd</option>
              <option value="tts-1">tts-1</option>
            </select>
          </label>
        </div>
      </div>

      <div class="row" id="browserVoiceRow">
        <label class="field grow">
          <span>Browser voice (used only when provider = Browser)</span>
          <select id="voiceSelect"></select>
        </label>
        <label class="field">
          <span>Speed</span>
          <input id="rate" type="range" min="0.7" max="1.4" step="0.05" value="1" />
        </label>
      </div>

      <label class="field">
        <span>Playback</span>
        <label class="check"><input id="autoplayReply" type="checkbox" /> Autoplay narration after each reply</label>
      </label>

      <hr style="border:none;border-top:1px solid var(--line);margin:6px 0 14px" />
      <button id="editPrompts" class="ghost" style="width:100%;margin-bottom:12px">✎ Edit workflow prompts</button>

      <button id="saveSettings" class="primary">Save</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
