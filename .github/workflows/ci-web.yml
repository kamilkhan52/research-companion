# See `ci-backend.yml` for why the workflow is split by path and what that costs.
name: CI (web)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "shared/**"
      - ".github/workflows/ci-web.yml"

concurrency:
  group: ci-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Vitest + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Same reasoning as the mobile job, smaller absolute win (install measures 3s here). Kept for
      # symmetry so the two client jobs do not drift apart. No postinstall script in this package,
      # so the lockfile alone is the correct key.
      - name: Cache node_modules
        id: node_modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: web-node-modules-${{ runner.os }}-node20-${{ hashFiles('web/package-lock.json') }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        if: steps.node_modules.outputs.cache-hit != 'true'
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      # `web/dist` is committed, so a source change that was not rebuilt would ship a stale SPA.
      - name: Verify dist is committed
        run: git diff --exit-code -- dist
