name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    # A real Postgres, because M2's ownership tests assert things only Postgres can tell us: the
    # CHECK constraint on a project id, the owner foreign key, `on conflict do nothing`. A fake
    # would assert my idea of those rules rather than the database's. Without this the tests skip,
    # and a skipped isolation test is indistinguishable from a passing one at a glance.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Test (pytest)
        # Still network-free by design (see tests/conftest.py) — the database is a loopback service
        # container, not an external call. RC_TEST_DATABASE_URL is what un-skips the ownership
        # tests; it is a throwaway CI database, not a secret.
        env:
          RC_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/rc_test
        run: python -m pytest

  mobile:
    name: Mobile (Jest + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm run test:ci
      - name: Typecheck
        run: npx tsc --noEmit

  web:
    name: Web (Vitest + tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Verify dist is committed
        run: git diff --exit-code -- dist
